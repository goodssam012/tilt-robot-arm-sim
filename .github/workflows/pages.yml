# 웹 버전 배포: main 에 올리면 public/ 과 three.js 파일을 GitHub Pages 로 올립니다.
# 주소: https://<계정>.github.io/<저장소>/
name: Deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build site
        run: |
          mkdir -p _site/vendor/three/build _site/vendor/three/examples/jsm/environments _site/vendor/three/examples/jsm/geometries
          cp -r public/* _site/
          cp node_modules/three/build/three.module.js _site/vendor/three/build/
          cp node_modules/three/examples/jsm/environments/RoomEnvironment.js _site/vendor/three/examples/jsm/environments/
          cp node_modules/three/examples/jsm/geometries/RoundedBoxGeometry.js _site/vendor/three/examples/jsm/geometries/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
