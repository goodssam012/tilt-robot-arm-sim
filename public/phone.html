<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>로봇팔 조종기</title>
<link rel="stylesheet" href="phone.css">
<style>
  .pad { display: grid; grid-template-columns: 1fr 1.15fr; gap: 10px; }
  .pad .col { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; }
  .pad button { padding: 0; min-height: 84px; font-size: 16px; }
  #btnGrip { font-size: 20px; min-height: 178px; }
  #btnGrip.active { background: var(--warn); }
  .grip-state { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .grip-state b { color: var(--warn); }
  .small button { padding: 11px 6px; font-size: 14px; }
  .tilt-vis .phone { width: 46px; height: 78px; border-radius: 10px; }
  #btnRec.active { background: var(--bad); color: #fff; }
  #btnPlay.active, #btnLoop.active { background: var(--accent); color: #001; }
  body.playing .pad button, body.playing #btnCal, body.playing #btnSpeed { opacity: .4; }
  header { flex-wrap: wrap; row-gap: 4px; }
  #vibChip { cursor: pointer; padding: 2px 8px; margin: -2px -4px; border-radius: 99px; border: 1px solid var(--line); }
  #vibChip .dot.warn { background: var(--warn); }
  /* 접촉할 때 화면 테두리가 번쩍 (진동이 안 느껴져도 보이도록) */
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 20; border: 8px solid transparent; }
  #flash.touch { animation: flashTouch .28s ease-out; }
  #flash.hit { animation: flashHit .4s ease-out; }
  #flash.floor { animation: flashFloor .45s ease-out; }
  @keyframes flashFloor { from { border-color: #ff8a3d; background: rgba(255, 138, 61, .2); } to { border-color: transparent; background: transparent; } }
  @keyframes flashTouch { from { border-color: var(--warn); } to { border-color: transparent; } }
  @keyframes flashHit { from { border-color: var(--bad); background: rgba(255, 93, 108, .18); } to { border-color: transparent; background: transparent; } }
  @media (prefers-reduced-motion: reduce) { #flash.touch, #flash.hit, #flash.floor { animation-duration: .01s; } }
</style>
</head>
<body>
<header>
  <h1>🦾 로봇팔 조종기</h1>
  <div class="status">
    <span><i class="dot" id="dServer"></i>서버</span>
    <span><i class="dot" id="dDisplay"></i>PC</span>
    <span><i class="dot" id="dSensor"></i>센서</span>
    <span id="vibChip" role="button" tabindex="0" title="눌러서 진동 테스트"><i class="dot" id="dVib"></i>진동 <b id="vibCount">0</b></span>
  </div>
</header>

<div class="card">
  <div class="tilt-vis"><div class="phone" id="phoneVis"></div></div>
  <div class="meter"><span>베이스 회전</span><div class="bar"><i class="center"></i><i class="fill" id="bYaw"></i></div><span class="val" id="vYaw">0</span></div>
  <div class="meter"><span>어깨</span><div class="bar"><i class="center"></i><i class="fill" id="bSh"></i></div><span class="val" id="vSh">0</span></div>
  <div class="meter"><span>팔꿈치</span><div class="bar"><i class="center"></i><i class="fill" id="bEl"></i></div><span class="val" id="vEl">0</span></div>
  <div class="grip-state">집게: <b id="gripText">열림</b> · <span id="bgName">배경 -</span></div>
</div>

<p class="help">
  <b>좌우 기울기</b> → 베이스 · <b>앞뒤 기울기</b> → 어깨 · <b>▲▼</b> → 팔꿈치 · <b>집기</b> → 잡기/놓기.
  팔이 물건에 닿으면 진동해요 (위의 <b>진동</b>을 눌러 테스트)
</p>

<div class="grow">
  <div class="row3 small">
    <button id="btnRec">● 녹화</button>
    <button id="btnPlay">▶ 재생</button>
    <button id="btnLoop">🔁 반복</button>
  </div>
  <div class="row3 small">
    <button id="btnPrev">◀ 배경</button>
    <button id="btnCam">🎥 시점</button>
    <button id="btnNext">배경 ▶</button>
  </div>
  <div class="row3 small">
    <button id="btnCal">⊙ 영점</button>
    <button id="btnSpeed">속도: 보통</button>
    <button id="btnRestart">↺ 다시</button>
  </div>
  <div class="pad">
    <div class="col">
      <button id="btnUp">▲<br>팔꿈치 올리기</button>
      <button id="btnDown">▼<br>팔꿈치 내리기</button>
    </div>
    <button id="btnGrip">✊<br>집기</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <h1>🦾 로봇팔 조종기</h1>
  <p>폰을 화면이 위로 오도록 편하게 눕혀 잡은 뒤<br>아래 버튼을 눌러 주세요.<br>누른 순간의 자세가 기준(영점)이 됩니다.</p>
  <button id="btnStart">시작하기</button>
  <p id="startErr" class="err"></p>
</div>
<div class="toast" id="toast"></div>
<div id="flash"></div>

<script type="module">
import { createController, axis, haptics } from './controller.js';

const $ = (id) => document.getElementById(id);
const toast = (t) => { $('toast').textContent = t; $('toast').classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('show'), 1600); };
const buzz = (ms) => { haptics.pulse(ms); updateVibUI(); };

// 진동 상태 표시: 초록 = 진동 됨, 노랑 = 아이폰 대체 햅틱, 빨강 = 진동 불가/차단
function updateVibUI() {
  const d = $('dVib');
  d.classList.toggle('on', haptics.mode === 'vibrate' && haptics.lastOk !== false);
  d.classList.toggle('warn', haptics.mode === 'ios');
  $('vibCount').textContent = haptics.count;
}
function flash(kind) {
  const f = $('flash');
  f.className = '';
  void f.offsetWidth;   // 애니메이션 다시 시작
  f.className = kind;
}
function testVibration() {
  const ok = haptics.pulse([200, 100, 200]);
  updateVibUI();
  flash('hit');
  if (haptics.mode === 'none') toast('이 브라우저는 진동을 지원하지 않아요');
  else if (haptics.mode === 'ios') toast('아이폰: iOS 18 이상에서만 약한 햅틱이 와요');
  else if (!ok) toast('진동이 차단됐어요. 화면을 한 번 터치한 뒤 다시 눌러 보세요');
  else toast('진동을 보냈어요. 안 느껴지면 무음·방해금지 해제, 진동 세기를 확인하세요');
}
$('vibChip').addEventListener('click', testVibration);

const ctl = createController({
  role: 'phone',
  onStatus: (s) => { $('dServer').classList.toggle('on', s.server); $('dDisplay').classList.toggle('on', s.display); },
  onFeedback: (m) => {
    if (m.vibrate) updateVibUI();
    if (m.contact) flash(m.contact);
    if (m.text) toast(m.text);
    if (m.background) $('bgName').textContent = '배경 ' + m.background;
    if (m.rec) setRecMode(m.rec);
    if (m.held === true) setGrip(true);              // 물건을 잡음 → 버튼은 '놓기'
    if (m.held === false || m.gripFail) setGrip(false);  // 놓았거나 잡을 물건이 없음 → '집기'
    if (typeof m.loop === 'boolean') $('btnLoop').classList.toggle('active', m.loop);
  },
});

let zero = null;
const speeds = [['느림', 0.5], ['보통', 1], ['빠름', 1.6]];
let speedIdx = 1;
let grip = false;
let elbowDir = 0;               // -1 올리기, +1 내리기
const out = { yaw: 0, shoulder: 0 };

function calibrate() {
  zero = { beta: ctl.raw.beta, gamma: ctl.raw.gamma };
  toast('영점을 맞췄어요');
}

function setBar(bar, val, v) {
  const w = Math.abs(v) * 50;
  bar.style.left = v >= 0 ? '50%' : (50 - w) + '%';
  bar.style.width = w + '%';
  val.textContent = (v * 100).toFixed(0);
}

ctl.onSensor((r) => {
  $('dSensor').classList.add('on');
  if (!zero) return;
  const db = r.beta - zero.beta;
  const dg = r.gamma - zero.gamma;
  out.yaw = axis(dg, 5, 32);          // 오른쪽으로 기울이면 오른쪽으로 회전
  out.shoulder = -axis(db, 5, 32);    // 앞으로 숙이면 팔이 앞/아래로
  $('phoneVis').style.transform = `perspective(300px) rotateX(${-db}deg) rotateY(${dg}deg)`;
});

// 30Hz 로 PC에 전송
setInterval(() => {
  if (!zero) return;
  const s = speeds[speedIdx][1];
  ctl.send({ type: 'ctrl', yaw: out.yaw, shoulder: out.shoulder, elbow: elbowDir, grip: grip ? 1 : 0, speed: s });
  setBar($('bYaw'), $('vYaw'), out.yaw);
  setBar($('bSh'), $('vSh'), out.shoulder);
  setBar($('bEl'), $('vEl'), -elbowDir);
}, 33);

// 누르고 있는 동안만 동작하는 버튼 (여러 손가락 동시 터치 지원)
// (터치와 마우스 신호를 따로 받으면 한 번 눌러도 두 번 실행되는 폰이 있어서 포인터 이벤트 하나만 사용)
function holdButton(el, onDown, onUp) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch { /* 무시 */ }
    el.classList.add('active');
    onDown();
  });
  const up = () => { if (!el.classList.contains('active')) return; el.classList.remove('active'); onUp(); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', (e) => e.preventDefault());   // 길게 누를 때 메뉴 방지
}
holdButton($('btnUp'), () => { elbowDir = -1; }, () => { if (elbowDir === -1) elbowDir = 0; });
holdButton($('btnDown'), () => { elbowDir = 1; }, () => { if (elbowDir === 1) elbowDir = 0; });

// 집게: 한 번 누르면 집기, 다시 누르면 놓기
function setGrip(on) {
  grip = on;
  $('btnGrip').classList.toggle('active', on);
  $('btnGrip').innerHTML = on ? '🖐<br>놓기' : '✊<br>집기';
  $('gripText').textContent = on ? '닫힘' : '열림';
}
let lastGripTap = 0;
$('btnGrip').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const now = performance.now();
  if (now - lastGripTap < 300) return;   // 같은 터치가 두 번 들어오는 경우 무시
  lastGripTap = now;
  setGrip(!grip);
  buzz(grip ? 30 : 15);
});
$('btnGrip').addEventListener('contextmenu', (e) => e.preventDefault());

const event = (name) => { ctl.send({ type: 'event', name }); buzz(20); };

// 녹화·재생 상태 표시 (PC에서 알려 줌)
function setRecMode(mode) {
  $('btnRec').classList.toggle('active', mode === 'rec');
  $('btnRec').textContent = mode === 'rec' ? '■ 녹화 끝' : '● 녹화';
  $('btnPlay').classList.toggle('active', mode === 'play');
  $('btnPlay').textContent = mode === 'play' ? '■ 재생 끝' : '▶ 재생';
  document.body.classList.toggle('playing', mode === 'play');
}
$('btnRec').onclick = () => event('rec_toggle');
$('btnPlay').onclick = () => event('play_toggle');
$('btnLoop').onclick = () => event('loop_toggle');
$('btnPrev').onclick = () => event('bg_prev');
$('btnNext').onclick = () => event('bg_next');
$('btnCam').onclick = () => event('camera');
$('btnRestart').onclick = () => event('restart');
$('btnCal').onclick = calibrate;
$('btnSpeed').onclick = () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  $('btnSpeed').textContent = `속도: ${speeds[speedIdx][0]}`;
};

$('btnStart').onclick = async () => {
  $('startErr').textContent = '';
  try {
    await ctl.start();
    calibrate();
    $('overlay').style.display = 'none';
    buzz(120);   // 시작할 때 한 번 진동 (진동이 되는 폰인지 바로 확인)
  } catch (e) {
    $('startErr').textContent = e.message;
  }
};
</script>
</body>
</html>
